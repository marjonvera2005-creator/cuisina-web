# Builds the Cuisina website (admin + owner portals) and publishes it on GitHub Pages
# at https://<account>.github.io/cuisina-web/ on every push to main.
# The Supabase / MapTiler settings come from the repository's Secrets, never from the code.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
        run: |
          if ! echo "$VITE_SUPABASE_URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$'; then
            echo "::error::Secret VITE_SUPABASE_URL must look like https://xxxx.supabase.co"; exit 1
          fi
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*|eyJ*) ;; *) echo "::error::Secret VITE_SUPABASE_PUBLISHABLE_KEY must start with sb_publishable_"; exit 1;; esac
          # The whole key: letters, digits, _ - . only (no "…" or spaces), and longer than the prefix.
          if ! echo "$VITE_SUPABASE_PUBLISHABLE_KEY" | LC_ALL=C grep -Eq '^[A-Za-z0-9_.-]{30,}$'; then
            echo "::error::Secret VITE_SUPABASE_PUBLISHABLE_KEY is incomplete. Paste the FULL key from web/.env.local (the part after =)"; exit 1
          fi
          # MapTiler keys are letters and digits only (no spaces, no description text).
          if ! echo "$VITE_MAPTILER_KEY" | LC_ALL=C grep -Eq '^[A-Za-z0-9]{10,}$'; then
            echo "::error::Secret VITE_MAPTILER_KEY is not a MapTiler key. Paste the key from web/.env.local (the part after =)"; exit 1
          fi
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
        run: npm run build
      # Opening a page directly (e.g. /cuisina-web/owner/bookings) serves 404.html: same app, same route.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
